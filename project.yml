name: PKHeXMac
options:
  bundleIdPrefix: com.pkhexmac
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PKHeXMac:
    type: application
    platform: macOS
    sources:
      - path: PKHeXMac/Sources/PKHeXSwiftUI
      - path: PKHeXMac/Resources/Assets.xcassets
    dependencies:
      - target: PKHeXCore
        embed: true
      - framework: PKHeX.Interop/bin/Release/net10.0/osx-arm64/publish/PKHeX.Interop.dylib
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pkhexmac.PKHeXMac
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/PKHeXMac/Sources/CPKHeXNative/include"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/PKHeXMac/Sources/CPKHeXNative/include"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PKHeXMac/Info.plist
      properties:
        CFBundleDisplayName: PKHeXMac
        NSHumanReadableCopyright: ""
        # Declared here rather than hand-edited into Info.plist: xcodegen regenerates that file
        # from this block, so anything only in the plist is silently dropped on the next generate.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Pokémon Save File
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.pkhexmac.savefile
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.pkhexmac.savefile
            UTTypeDescription: Pokémon Save File
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - sav
                - dsv
                - dat
                - bin
                - gci
                - bin2
                - srm
                - rvsave
                - main

  PKHeXCore:
    type: framework
    platform: macOS
    sources:
      - path: PKHeXMac/Sources/PKHeXCore
    dependencies:
      - framework: PKHeX.Interop/bin/Release/net10.0/osx-arm64/publish/PKHeX.Interop.dylib
        embed: false
    preBuildScripts:
      - name: Publish PKHeX.Interop (NativeAOT)
        script: |
          set -e
          /usr/bin/env -i \
            HOME="$HOME" \
            PATH="$HOME/.dotnet:/usr/bin:/bin:/usr/sbin:/sbin" \
            dotnet publish "$SRCROOT/PKHeX.Interop/PKHeX.Interop.csproj" -c Release -r osx-arm64
        alwaysOutOfDate: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pkhexmac.PKHeXCore
        DEFINES_MODULE: YES
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/PKHeXMac/Sources/CPKHeXNative/include"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/PKHeXMac/Sources/CPKHeXNative/include"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/Frameworks"
    info:
      path: PKHeXMac/PKHeXCore-Info.plist
      properties: {}
